version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unconvert
    - nakedret
    - bodyclose
    - noctx
    - gosec
    - gocyclo
  settings:
    gocyclo:
      min-complexity: 20
    gosec:
      excludes:
        - G114
        - G115
  exclusions:
    paths:
      - "_test\\.go$"
      - "^_examples/"
    rules:
      - linters:
          - staticcheck
        text: "QF1008"

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
