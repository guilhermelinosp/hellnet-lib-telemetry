version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - misspell
    - unconvert
    - gofmt
    - goimports
    - revive
    - gocyclo
    - nakedret
    - bodyclose
    - noctx
    - gosec
  settings:
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: exported
          severity: warning
  exclusions:
    paths:
      - "**/*_test.go"
      - "_examples/**"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
