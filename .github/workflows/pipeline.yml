name: pipeline

# Library CI: cut a semver tag + GitHub Release on every code change to main
# (changes limited to .github/ are ignored so CI edits never trigger a
# release), then run the quality gate.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  guard-semver:
    name: guard-semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Block auto-major (Go module path has no /v2 suffix)
        run: |
          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No tags yet, skipping"
            exit 0
          fi
          if git log --format="%s" "$LAST_TAG..HEAD" 2>/dev/null | grep -qE "BREAKING CHANGE|!:"; then
            echo "::error::Major bump detected but module path has no /v2 suffix (Go requires /v2 for major>=2). Remove BREAKING CHANGE/!: markers or migrate the module to /v2 manually."
            exit 1
          fi
          echo "No breaking markers: auto-bump stays below v2. OK"

  release:
    name: release
    needs: [guard-semver]
    permissions:
      contents: write
    uses: guilhermelinosp/templates/.github/workflows/release.yml@fde7d4a5a2e7aa5dd42e8812df4783daa39b1543 # main

  quality:
    name: quality
    needs: [release]
    permissions:
      contents: read
      pull-requests: write
    uses: guilhermelinosp/templates/.github/workflows/lib-quality.yml@e7d093b460c1e25f16121d509eefcbb597612c95 # main
    with:
      go-version-file: go.mod