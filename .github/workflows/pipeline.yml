name: pipeline

# Library CI: cut a semver tag + GitHub Release on every code change to main
# (changes limited to .github/ are ignored so CI edits never trigger a
# release), then run the quality gate.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: release
    uses: guilhermelinosp/templates/.github/workflows/release.yml@main
    secrets: inherit
    permissions:
      contents: write

  quality:
    name: quality
    needs: [release]
    uses: guilhermelinosp/templates/.github/workflows/lib-quality.yml@main
    with:
      go-version-file: go.mod
