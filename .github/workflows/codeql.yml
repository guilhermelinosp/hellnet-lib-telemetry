name: codeql

on:
  pull_request:
    branches: ["main"]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ['go']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
          queries: +security-and-quality
          # build-command explícito evita o fallback do autobuild para `make`,
          # que rodaria o target `lint` (golangci-lint) — não instalado no
          # runner do CodeQL → "Error 127". CodeQL analisa via go build direto.
          build-command: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
