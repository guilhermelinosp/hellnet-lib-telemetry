name: codeql

on:
  pull_request:
    branches: ["main"]

permissions:
  actions: read
  contents: read
  security-events: write

# NOTE: Go language scanning is temporarily DISABLED.
# CodeQL CLI 2.26.3 (bundled with github/codeql-action@v4) does not support
# Go 1.27 — autobuild/manual extraction fails on the 1.27 stdlib/syntax.
# Re-enable the `go` matrix entry once CodeQL ships Go 1.27 support, or after
# the project is downgraded to Go <=1.26.
jobs:
  analyze:
    name: analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
