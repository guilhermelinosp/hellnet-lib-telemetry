name: codeql

# Fluxo reutilizável centralizado em ci-templates.
# Substitui a definição local duplicada para evitar drift entre as libs.
# guilhermelinosp/ci-templates/.github/workflows/codeql.yml
on:
  pull_request:
    branches: ["main"]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    uses: guilhermelinosp/ci-templates/.github/workflows/codeql.yml@main
    with:
      languages: '[{"language":"actions","build-mode":"none"},{"language":"go","build-mode":"autobuild"}]'
