name: pr-check


concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    uses: guilhermelinosp/templates/.github/workflows/shellcheck.yml@df9f66533749a4a3a4b59c18a828a179800de096

  merge-check:
    uses: guilhermelinosp/templates/.github/workflows/merge-check.yml@df9f66533749a4a3a4b59c18a828a179800de096

  gitleaks:
    uses: guilhermelinosp/templates/.github/workflows/gitleaks.yml@df9f66533749a4a3a4b59c18a828a179800de096

  labeler:
    uses: guilhermelinosp/templates/.github/workflows/labeler.yml@df9f66533749a4a3a4b59c18a828a179800de096
    with:
      app-client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
    secrets: inherit

  quality:
    name: quality
    uses: guilhermelinosp/templates/.github/workflows/lib-quality.yml@df9f66533749a4a3a4b59c18a828a179800de096
    with:
      go-version-file: go.mod
      extra-commands: |
        set -euo pipefail
        latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)"
        test -n "$latest_tag"
        old_tree="$RUNNER_TEMP/hellnet-lib-telemetry-$latest_tag"
        old_api="$RUNNER_TEMP/hellnet-lib-telemetry-$latest_tag.api"
        new_api="$RUNNER_TEMP/hellnet-lib-telemetry-current.api"
        git worktree add --detach "$old_tree" "$latest_tag"
        trap 'git worktree remove "$old_tree" --force' EXIT
        (
          cd "$old_tree"
          go run golang.org/x/exp/cmd/apidiff@latest -m -w "$old_api" github.com/guilhermelinosp/hellnet-lib-telemetry
        )
        go run golang.org/x/exp/cmd/apidiff@latest -m -w "$new_api" github.com/guilhermelinosp/hellnet-lib-telemetry
        set +e
        apidiff_output="$(go run golang.org/x/exp/cmd/apidiff@latest -m -incompatible "$old_api" "$new_api" 2>&1)"
        apidiff_status=$?
        set -e
        if [ "$apidiff_status" -ne 0 ]; then
          echo "$apidiff_output"
          exit "$apidiff_status"
        fi
        incompatible="$(printf '%s\n' "$apidiff_output" | grep -v '^Ignoring internal package' || true)"
        if [ -n "$incompatible" ]; then
          echo "::error::incompatible public API change detected against $latest_tag"
          echo "$incompatible"
          exit 1
        fi

  pr-gate:
    if: always()
    needs: [lint, merge-check, gitleaks, labeler, quality]
    runs-on: ubuntu-latest
    steps:
      - name: gate
        shell: python
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          import json, os, sys
          needs = json.loads(os.environ['NEEDS'])
          failed = [k for k, v in needs.items() if v.get('result') not in ('success', 'skipped')]
          if failed:
              print('BLOCKED-BY:', failed)
              sys.exit(1)
          print('ALL-GREEN')
