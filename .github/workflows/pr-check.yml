name: pr-check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    uses: guilhermelinosp/templates/.github/workflows/shellcheck.yml@af2bcbe5d72882b5ab9145a02620d229dd14587f # main

  merge-check:
    uses: guilhermelinosp/templates/.github/workflows/merge-check.yml@af2bcbe5d72882b5ab9145a02620d229dd14587f # main

  gitleaks:
    uses: guilhermelinosp/templates/.github/workflows/gitleaks.yml@af2bcbe5d72882b5ab9145a02620d229dd14587f # main

  labeler:
    uses: guilhermelinosp/templates/.github/workflows/labeler.yml@af2bcbe5d72882b5ab9145a02620d229dd14587f # main

  quality:
    name: quality
    uses: guilhermelinosp/templates/.github/workflows/lib-quality.yml@e7d093b460c1e25f16121d509eefcbb597612c95 # main
    with:
      go-version-file: go.mod
